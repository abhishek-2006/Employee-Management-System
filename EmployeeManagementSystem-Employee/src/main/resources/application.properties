# ========================================================
# Employee Portal Configuration (Port 8082)
# ========================================================

server.port=8082

# Database Configuration (Connects to shared MySQL database: employee_management)
spring.datasource.url=jdbc:mysql://localhost:3306/employee_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Session Configuration
server.servlet.session.timeout=120m
server.servlet.session.cookie.name=EMS_EMPLOYEE_SESSION

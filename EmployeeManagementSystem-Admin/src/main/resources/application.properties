# ========================================================
# Admin Portal Configuration (Port 8081)
# ========================================================

server.port=8081

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/employee_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Email Notification Configuration (Spring Mail)
# Configure with your SMTP details if email notifications are desired.
# If left as placeholders, leave approvals/rejections will still log and notify in-app without errors.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_EMAIL
spring.mail.password=YOUR_GMAIL_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Session Configuration
server.servlet.session.timeout=120m
server.servlet.session.cookie.name=EMS_ADMIN_SESSION
